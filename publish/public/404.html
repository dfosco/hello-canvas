<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting&hellip;</title>
    <script>
      /* GitHub Pages SPA fallback (rafgraph/spa-github-pages technique, MIT). */
      (function (l) {
        var path = l.pathname
        var directory = path.slice(0, path.lastIndexOf('/') + 1)
        var rest = path.slice(directory.length) + l.search + l.hash
        l.replace(l.protocol + '//' + l.host + directory + '?p=' + encodeURIComponent(rest) + '&b=' + encodeURIComponent(directory))
      })(window.location)
    </script>
  </head>
  <body></body>
</html>
